name: Cloudflare Serverless Backend CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-worker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'backend-worker/package-lock.json'

    - name: Install Dependencies
      run: |
        cd backend-worker
        npm ci

    # FIXED STEP: Using Hono's native project verification validation command
    - name: Run TypeScript Type Checks
      run: |
        cd backend-worker
        npm run check
